name: Test ALVIE

on:
  pull_request:
    paths:
      - '.github/workflows/alvie-tests.yml'
      - 'alvie/**'
      - 'check_all.sh'
      - 'check_one.sh'
      - 'learn_all.sh'
      - 'learn_one_nospecial.sh'
      - 'regression.sh'
      - 'script_helpers.sh'
      - 'results/**'
      - 'counterexamples/**'
      - 'spec-lib/**'
      - 'sancus-core-gap'
  push:
    branches: [main, alvie-ng]
    paths:
      - '.github/workflows/alvie-tests.yml'
      - 'alvie/**'
      - 'check_all.sh'
      - 'check_one.sh'
      - 'learn_all.sh'
      - 'learn_one_nospecial.sh'
      - 'regression.sh'
      - 'script_helpers.sh'
      - 'results/**'
      - 'counterexamples/**'
      - 'spec-lib/**'
      - 'sancus-core-gap'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    name: Run isolated ALVIE tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13.1"
          dune-cache: true
      - name: Restore OCaml dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.opam/4.13.1
          key: ${{ runner.os }}-ocaml-4.13.1-${{ hashFiles('alvie/code/dune-project', 'alvie/code/*.opam') }}
      - name: Install OCaml dependencies
        working-directory: alvie/code
        run: opam install -y . --deps-only --with-test
      - name: Build ALVIE
        working-directory: alvie/code
        run: opam exec -- dune build
      # dune build -p builds a package with only the libraries of that package and of the installed ones: it fails
      # (Library "sancus" not found) if alvie-core starts to depend on alvie-sancus or alvie-rtl-util.
      - name: Check that alvie-core and alvie-rtl-util build on their own
        working-directory: alvie/code
        run: |
          opam exec -- dune build -p alvie-core --build-dir _build-alvie-core @install
          opam exec -- dune build -p alvie-rtl-util --build-dir _build-alvie-rtl-util @install
      - name: Run isolated feature suite
        working-directory: alvie/code
        run: opam exec -- dune exec tt_features -- test --color=never
      - name: Run CLI diagnostics
        working-directory: alvie/code
        run: opam exec -- bash test/cli_diagnostics.sh
      - name: Check the input generator against its corpus
        working-directory: alvie/code
        run: opam exec -- dune exec tt_inputgen_golden -- check
      - name: Run the plugin files suite
        working-directory: alvie/code
        run: opam exec -- dune exec tt_plugin -- test --color=never
      - name: Run the suite of Tiny and of the commands of Core
        working-directory: alvie/code
        run: opam exec -- dune exec tt_tiny -- --color=never
      - name: Run the W-method oracle suite
        working-directory: alvie/code
        run: opam exec -- dune test test/wmethod
      - name: Check the plugin templates
        working-directory: alvie/code
        run: opam exec -- bash test/plugin_new.sh
      - name: Check external plugins (Tiny in Python)
        working-directory: alvie/code
        run: opam exec -- bash test/rpc.sh

  # The simulator-backed suites need Verilator, the MSP430 toolchain and mCRL2: they run in the published image,
  # as its own user (alvie), on a checkout that this user can write.
  simulator-tests:
    name: Run simulator-backed regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          # The experiments check out older Sancus commits: the submodule needs its whole history
          fetch-depth: 0
      - name: Pull the ALVIE image
        run: docker pull matteobusi/alvie:latest
      # The published image may predate the dependencies of this checkout: add them (a no-op once it has them)
      - name: Add the OCaml dependencies of this checkout to the image
        run: |
          printf '%s\n' 'FROM matteobusi/alvie:latest' \
            'RUN eval "$(opam env --switch=4.13.1)" && opam install -y yaml yojson' \
            | docker build -t alvie-ci -
      - name: Let the image user write to the checkout
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
      - name: Run the witness and learning regression
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alvie-ci bash -c \
            'git config --global --add safe.directory "*" && eval "$(opam env --switch=4.13.1)" && ./regression.sh all'
      - name: Run the simulator regression suite
        if: success() || failure()
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/alvie/code alvie-ci bash -c \
            'git config --global --add safe.directory "*" && eval "$(opam env --switch=4.13.1)" && dune exec tt_attack -- test --color=never'
      - name: Run the properties suite (mCRL2)
        if: success() || failure()
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/alvie/code alvie-ci bash -c \
            'git config --global --add safe.directory "*" && eval "$(opam env --switch=4.13.1)" && dune exec tt_properties -- test --color=never && bash test/property_cmd.sh && dune build && _build/default/bin/alvie.exe tiny fixtures --out /tmp/alvie-tiny-fixtures && bash test/plugin_new.sh'
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: |
            logs/regression/
            alvie/code/_build/_tests/
          if-no-files-found: ignore

  # The fixtures of plugins/sancus learn twelve models on the simulator, one after the other: in a job of their own,
  # beside the regression
  sancus-fixtures:
    name: Check the fixtures of Sancus
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Pull the ALVIE image
        run: docker pull matteobusi/alvie:latest
      - name: Add the OCaml dependencies of this checkout to the image
        run: |
          printf '%s\n' 'FROM matteobusi/alvie:latest' \
            'RUN eval "$(opam env --switch=4.13.1)" && opam install -y yaml yojson' \
            | docker build -t alvie-ci -
      - name: Let the image user write to the checkout
        run: chmod -R a+rwX "$GITHUB_WORKSPACE"
      - name: Learn and compare the fixtures
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/alvie/code alvie-ci bash -c \
            'git config --global --add safe.directory "*" && eval "$(opam env --switch=4.13.1)" && dune build && _build/default/bin/alvie.exe sancus fixtures --sancus ../../sancus-core-gap --tmpdir /tmp/alvie-sim --out /tmp/alvie-sancus-fixtures'
