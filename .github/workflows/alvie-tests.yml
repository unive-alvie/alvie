name: Test ALVIE

on:
  pull_request:
    paths:
      - '.github/workflows/alvie-tests.yml'
      - 'alvie/**'
      - 'check_one.sh'
      - 'script_helpers.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/alvie-tests.yml'
      - 'alvie/**'
      - 'check_one.sh'
      - 'script_helpers.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    name: Run isolated ALVIE tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.13.1"
          dune-cache: true
      - name: Restore OCaml dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.opam/4.13.1
          key: ${{ runner.os }}-ocaml-4.13.1-${{ hashFiles('alvie/code/dune-project', 'alvie/code/alvie.opam') }}
      - name: Install OCaml dependencies
        working-directory: alvie/code
        run: opam install -y . --deps-only --with-test
      - name: Build ALVIE
        working-directory: alvie/code
        run: opam exec -- dune build
      - name: Run isolated feature suite
        working-directory: alvie/code
        run: opam exec -- dune exec tt_features -- test --color=never
      - name: Run CLI diagnostics
        working-directory: alvie/code
        run: opam exec -- bash test/cli_diagnostics.sh
