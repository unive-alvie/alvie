name: Deploy website

on:
  push:
    branches: [main]
    # A new release adds its documentation to the site
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9]*']
  workflow_dispatch:
  # ALVIE in the browser (/alvie/play/) is the site that the tests build (the artifact alvie-vscode-site): publish it
  # again when they pass on the branches that have it
  workflow_run:
    workflows: [Test ALVIE]
    types: [completed]
    branches: [alvie-ng, feat/browser-tutorials]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

env:
  ASTRO_TELEMETRY_DISABLED: 1

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The development documentation always comes from main, also when a tag triggers the
          # build; the release tags are needed to build the documentation of each release
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build the documentation of every version
        working-directory: site
        run: bash scripts/build-versions.sh
      - name: Publish organization site
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: unive-alvie/unive-alvie.github.io
          publish_branch: gh-pages
          publish_dir: site/dist
          force_orphan: true
      - name: Add ALVIE in the browser
        # The newest site of a successful run of the tests, from the first branch that has one; only the project site
        # gets it (the home page links to /alvie/play/). An artifact lasts 90 days: a run of the tests makes a new one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in main alvie-ng feat/browser-tutorials; do
            for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow alvie-tests.yml --branch "$branch" --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
              rm -rf /tmp/alvie-play
              # Only a site made to be published: without the tutorials that are not published yet
              if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name alvie-vscode-site --dir /tmp/alvie-play 2>/dev/null \
                  && [ -f /tmp/alvie-play/alvie/bundle/publishable ]; then
                rm -rf site/dist/play && mv /tmp/alvie-play site/dist/play
                echo "ALVIE in the browser: the site of run $run ($branch)"
                exit 0
              fi
            done
          done
          echo "::warning::No site of ALVIE in the browser was found; /alvie/play/ is not published"
      - name: Configure project Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload project site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Deploy project site
        id: deployment
        uses: actions/deploy-pages@v4
